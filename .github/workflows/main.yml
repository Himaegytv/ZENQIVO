name: Unpack ZENQIVO Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract project
        run: |
          unzip -q ZENQIVO_Player_0.14.0_GitHub_ready.zip -d /tmp/zenqivo
          rsync -a /tmp/zenqivo/zenqivo_player/ ./
          rm -f ZENQIVO_Player_0.14.0_GitHub_ready.zip

